<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIZZARIA DO AMIGAO</title>
    <link rel="stylesheet" href="/css/cadastro.css">
    <link rel="shortcut icon" href="/img/pizza.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="informacoes">
            <h2>CADASTRO</h2>

            <div class="campos">
                <p>Nome</p>
                <input type="text" name="nome" id="nome" placeholder="Digite seu nome aqui">

                <p>Email</p>
                <input type="email" name="email" id="email" placeholder="Digite seu E-mail">

                <p>Telefone</p>
                <input type="text" name="telefone" id="telefone" maxlength="15">


                <p>Senha</p>

                <div class="campoSenha">

                    <input type="password" id="senha" placeholder="Digite sua senha">

                    <button type="button" onclick="mostrarSenha()">
                        👁
                    </button>

                </div>
                <p id="esqueceuSenha"><a href="/html/esqueceuSenha.html">Esqueceu a senha?</a></p>
            </div>

            <button class="botao" onclick="cadastrar()">Cadastrar</button>
            <button class="botao">Voltar</button>
        </div>
        <div class="imagem">
            <img src="/img/cadastro.jpg" alt="">
        </div>
    </div>

    <script src="/js/cadastro.js"></script>
</body>
</html>
